<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Droomwereld</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a0033 0%, #330066 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            width: 800px;
            height: 600px;
            background: #0a0015;
            border: 3px solid #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            border-radius: 10px;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #0a0015;
        }

        #ui {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            color: #00ffff;
            font-size: 18px;
            font-weight: bold;
            z-index: 100;
        }

        #levelInfo {
            font-size: 20px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
        }

        #score {
            font-size: 16px;
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border: 2px solid #00ffff;
            border-radius: 10px;
            text-align: center;
            color: #00ffff;
            z-index: 200;
            display: none;
            min-width: 300px;
        }

        #gameOver h1 {
            font-size: 36px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
        }

        #gameOver p {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .button {
            background: linear-gradient(135deg, #00ffff, #0099ff);
            color: black;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
        }

        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #1a0033, #330066);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #00ffff;
            z-index: 150;
        }

        #startScreen h1 {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
            animation: glow 2s ease-in-out infinite;
        }

        #startScreen p {
            font-size: 18px;
            margin-bottom: 30px;
            text-align: center;
            max-width: 400px;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 20px rgba(0, 255, 255, 0.8); }
            50% { text-shadow: 0 0 40px rgba(0, 255, 255, 1); }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="startScreen">
            <h1>🌙 Droomwereld 🌙</h1>
            <p>Ga slapen en betree een magische droomwereld vol avontuur</p>
            <button class="button" onclick="game.startGame()">Ga Slapen</button>
        </div>
        <div id="ui" style="display: none;">
            <div id="levelInfo"></div>
            <div id="score"></div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div id="gameOver">
            <h1 id="gameOverTitle">Game Over</h1>
            <p id="gameOverMessage"></p>
            <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
                <button class="button" id="retryBtn" onclick="game.retryLevel()">Probeer Opnieuw (Zelfde Level)</button>
                <button class="button" onclick="location.reload()">Begin Helemaal Opnieuw</button>
            </div>
        </div>
    </div>

    <script src="js/levels.js"></script>
    <script src="js/robot.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
